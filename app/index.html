  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/student.css">
  <script>
    // apply theme before first paint
    try {
      var s = JSON.parse(localStorage.getItem('qp1:settings') || '{}');
      if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
      if (s.textSize) document.documentElement.dataset.size = s.textSize;
    } catch (e) {}
  </script>
  <script>
    // If the app can't start in this browser, say so (with the reason) instead of leaving a blank page.
    // main.js sets window.crStarted once it runs. Before that, any error, a script that fails to load,
    // or 12 seconds with nothing means it won't start here.
    (function () {
      var shown = false, why = '';
      function cantStart(old) {
        if (shown || window.crStarted) return;
        shown = true;
        var m = document.getElementById('main');
        if (!m) return;
        var safari = /Safari/.test(navigator.userAgent) && !/Chrome|Chromium|Edg|Firefox/.test(navigator.userAgent);
        m.innerHTML = '<section class="page" style="max-width:640px"><h1>Cramming couldn\'t start in this browser</h1>' +
          '<p><strong>Open www.cramming.net in Chrome, Edge or Firefox</strong> to keep going. Your work is saved to your account, so nothing is lost.</p>' +
          (old && safari ? '<p>Or update Safari: on a Mac, open System Settings, then General, then Software Update.</p>' : '') +
          '<p>Taking an exam? Tell your proctor now.</p>' +
          (why ? '<p style="font-size:13px;opacity:.75">Details for your instructor: ' + why.replace(/[<>&]/g, '') + ' · ' + navigator.userAgent.replace(/[<>&]/g, '') + '</p>' : '') +
          '</section>';
      }
      window.addEventListener('error', function (e) {
        if (window.crStarted) return;
        var t = e && e.target;
        if (t && t.tagName === 'SCRIPT') { why = 'could not load ' + (t.src || 'a script'); cantStart(false); return; }
        why = (e && e.error && e.error.name ? e.error.name + ': ' : '') + (e && e.message || '');
        cantStart(e && e.error instanceof SyntaxError);
      }, true);
      window.addEventListener('unhandledrejection', function (e) { if (window.crStarted) return; why = String(e && e.reason && (e.reason.message || e.reason) || 'unhandled'); cantStart(false); });
      if (!('noModule' in document.createElement('script'))) document.addEventListener('DOMContentLoaded', function () { cantStart(true); });
      setTimeout(function () { if (!window.crStarted) { why = why || 'the app did not start within 12 seconds'; cantStart(false); } }, 12000);
    })();
  </script>
  <script defer src="vendor/katex/katex.min.js"></script>
  <script defer src="vendor/hljs/highlight.min.js"></script>
  <script type="module" src="js/main.js"></script>
</head>

  </main>

</body>
